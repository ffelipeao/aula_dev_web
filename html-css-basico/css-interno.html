<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de CSS interno</title>

    <!-- O CSS interno fica dentro de style, no próprio arquivo HTML -->
    <style>
        body {
            font-family: Arial, sans-serif; /* Define o tipo de letra */
            background-color: #f2f2f2;    /* Define a cor do fundo */
        }

        h1 {
            color: #7c3aed; /* Define a cor dos títulos h1 */
        }

        .aviso {
            padding: 12px;               /* Cria espaço dentro da caixa */
            background-color: #ede9fe;   /* Define a cor da caixa */
            border-left: 4px solid #7c3aed; /* Cria uma borda à esquerda */
        }
    </style>
</head>
<body>
    <h1>CSS interno</h1>
    <p class="aviso">O estilo deste exemplo está dentro da tag style.</p>
</body>
</html>
