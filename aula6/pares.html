<!-- condicoes.html -->
<!DOCTYPE html>
<html>

<head>
    <title>Teste JS</title>
</head>

<body>
    <div>
        <h1>Testando JS local com condições</h1>
        <input type="number" id="edtvalor" placeholder="Digite o valor">
        <button onclick="percorreValores()">Verificar</button>
    </div>
    <div>
        <h2>Resultado</h2>
        <p>Valor: <span id="valor"></span></p>
        <p>Saída 1: <span id="resultado"></span></p>
        <p>Saída 2: <span id="resultado2"></span></p>
    </div>
    <script>
        function percorreValores() {
            let valor = parseInt(document.getElementById("edtvalor").value);
            document.getElementById("valor").innerHTML = valor;
            let i = 0;
            let resultado = "";
            let resultado2 = "";
            //Mostrando os números pares    
            while (i < valor) {
                //Mostrando os números pares    
                if (i % 2 == 0) {
                    resultado += "Número par: " + i + "<br>";
                }
                //Mostrando os números ímpares    
                if (i % 2 != 0) {
                    resultado2 += "Número ímpar: " + i + "<br>";
                }
                i++;
            }

            document.getElementById("resultado").innerHTML = resultado;
            document.getElementById("resultado2").innerHTML = resultado2;
        }
    </script>
</body>

</html>
