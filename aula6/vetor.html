<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetor</title>
</head>

<body>
    <h1>Vetor</h1>
    <input type="text" id="edtfruta" placeholder="Digite a fruta">
    <button onclick="adicionarFruta()">Adicionar</button>
    <button onclick="removerFruta()">Remover</button>
    <div>
        <h2>Resultado</h2>
        <p>Saída: <span id="resultado"></span></p>
    </div>
    <script>
        let frutas = ["banana", "maçã", "laranja", "uva", "pêra"];
        let dados = "";

        function adicionarFruta() {
            let fruta = document.getElementById("edtfruta").value;
            if (fruta.trim() === "") {
                return; // Não adiciona se estiver vazio
            }

            frutas.push(fruta);
            document.getElementById("edtfruta").value = "";

            // Limpar dados anteriores
            dados = "";

            // Atualizar a lista de frutas
            for (let i = 0; i < frutas.length; i++) {
                if (i == frutas.length - 1) {
                    dados += frutas[i];
                } else {
                    dados += frutas[i] + ", ";
                }
            }
            document.getElementById("resultado").innerHTML = dados;
        }

        // Mostrar frutas iniciais
        window.onload = function () {
            for (let i = 0; i < frutas.length; i++) {
                if (i == frutas.length - 1) {
                    dados += frutas[i];
                } else {
                    dados += frutas[i] + ", ";
                }
            }
            document.getElementById("resultado").innerHTML = dados;
        }

        // Remover fruta
        function removerFruta() {
            let fruta = document.getElementById("edtfruta").value;
            if (fruta.trim() === "") {
                return; // Não remove se estiver vazio
            }

            // Encontrar o índice da fruta
            let index = frutas.indexOf(fruta);
            if (index !== -1) {
                frutas.splice(index, 1); // Remove a fruta no índice encontrado
                document.getElementById("edtfruta").value = "";

                // Atualizar a exibição
                dados = "";
                for (let i = 0; i < frutas.length; i++) {
                    if (i == frutas.length - 1) {
                        dados += frutas[i];
                    } else {
                        dados += frutas[i] + ", ";
                    }
                }
                document.getElementById("resultado").innerHTML = dados;
            }
        }

        let numeros = [];
        // Adicionar elementos
        numeros.push(10);
        numeros.push(20);
        numeros.push(30);
        numeros.push(40);
        numeros.push(50);
        console.log(numeros);
        // Remover último elemento
        numeros.pop();
        console.log(numeros);
        // Remover primeiro elemento
        numeros.shift();
        console.log(numeros);
        // Adicionar elemento no início
        numeros.unshift(10);
        console.log(numeros);
        // Adicionar elemento em uma posição específica
        // 2 é a posição e 0 é o número de elementos a serem removidos e 100 é o elemento a ser adicionado
        numeros.splice(2, 0, 100);
        console.log(numeros);
        // Remover elemento em uma posição específica
        // 2 é a posição e 1 é o número de elementos a serem removidos
        numeros.splice(2, 1);
        console.log(numeros);
        // Substituir elemento em uma posição específica
        // 2 é a posição e 1 é o número de elementos a serem removidos e 99 é o elemento a ser adicionado
        numeros.splice(2, 1, 99);
        console.log(numeros);
        // Remover todos os elementos
        numeros.length = 0;
        console.log(numeros);

    </script>
</body>

</html>
