<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de CSS inline</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f2f2f2;">
    <!-- O atributo style adiciona o CSS diretamente ao elemento -->
    <h1 style="color: #1d4ed8;">CSS inline</h1>

    <!-- margin-bottom cria um espaço abaixo do parágrafo -->
    <p style="margin-bottom: 20px;">O estilo deste exemplo está dentro das tags HTML.</p>

    <!-- background-color muda o fundo e padding cria espaço interno -->
    <button style="color: white; background-color: #1d4ed8; padding: 10px; border: 0;">
        Botão de exemplo
    </button>
</body>
</html>
